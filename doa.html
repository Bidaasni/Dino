<main>
    <!-- CARI DOA HARIAN & DZIKIR -->
    <div class="card">
        <h2>
            <span>Cari Doa & Dzikir</span>
            <button type="button" class="voice-search-btn" id="voiceBtn" onclick="mulaiCariSuara()" title="Cari dengan suara">

        <p id="labelDoaSelected" style="margin-top: 10px;">🎧 Pilih doa atau dzikir dari hasil pencarian di atas</p>

            <button class="btn-offline" id="btnOfflineDoaSearch" onclick="simpanDoaSearchOffline()">🌐 Simpan Offline</button>

<script>
// Mode Terang / Gelap
const htmlElement = document.documentElement;
const themeBtn = document.getElementById('themeToggleBtn');
const savedTheme = localStorage.getItem('quranTheme');

if (savedTheme) {
    htmlElement.setAttribute('data-theme', savedTheme);
    updateThemeButtonText(savedTheme);
}

function toggleTheme() {
    const currentTheme = htmlElement.getAttribute('data-theme');
    if (currentTheme === 'light') {
        htmlElement.removeAttribute('data-theme');
        localStorage.setItem('quranTheme', 'dark');
        updateThemeButtonText('dark');
    } else {
        htmlElement.setAttribute('data-theme', 'light');
        localStorage.setItem('quranTheme', 'light');
        updateThemeButtonText('light');
    }
}

function updateThemeButtonText(theme) {
    if (theme === 'light') {
        themeBtn.innerHTML = '🌙 Ganti ke Mode Gelap';
    } else {
        themeBtn.innerHTML = '☀️ Ganti ke Mode Terang';
    }
}

// Inisialisasi IndexedDB untuk Audio Doa
let db;
const dbReq = indexedDB.open('doaAudioDB', 1);

dbReq.onupgradeneeded = function(e) {
    db = e.target.result;
    if (!db.objectStoreNames.contains('audiosDoa')) {
        db.createObjectStore('audiosDoa');
    }
};

dbReq.onsuccess = function(e) {
    db = e.target.result;
};

// Fungsi Simpan Audio ke IndexedDB
async function simpanAudioOffline(idKey, urlAudio) {
    const btn = document.getElementById('btnOfflineDoaSearch');
    if (!btn) return;

    const originalText = btn.innerHTML;
    btn.innerHTML = "⏳ Mengunduh...";
    btn.disabled = true;

    try {
        const response = await fetch(urlAudio);
        const blob = await response.blob();

        const tx = db.transaction('audiosDoa', 'readwrite');
        const store = tx.objectStore('audiosDoa');
        store.put(blob, idKey);

        tx.oncomplete = function() {
            btn.innerHTML = "✅ Done";
            btn.style.background = "var(--hijau-card)";
            btn.style.borderColor = "var(--gold)";
            btn.style.color = "var(--gold-terang)";
            btn.disabled = false;
            
            const statusText = document.getElementById('statusDoaSearch');
            if (statusText) {
                statusText.innerHTML = "Audio Siap Di Dengar Tanpa Internet";
                statusText.style.color = "var(--gold-terang)";
            }

            if (idKey === currentSelectedDoaId) {
                const audioElem = document.getElementById('audioSearchDoa');
                if (audioElem) audioElem.src = URL.createObjectURL(blob);
            }
        };
    } catch (err) {
        alert("Gagal mengunduh audio. Pastikan file MP3 sudah di-upload di server.");
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}

// DATABASE DOA HARIAN & DZIKIR (Digabung)
const dataDoaHarian = [
    { id: 'doa_makan', nama: 'Doa Sebelum Makan', url: 'audio/doa-sebelum-makan.mp3' },
    { id: 'doa_tidur', nama: 'Doa Sebelum Tidur', url: 'audio/doa-sebelum-tidur.mp3' },
    { id: 'doa_masuk_masjid', nama: 'Doa Masuk Masjid', url: 'audio/doa-masuk-masjid.mp3' },
    { id: 'doa_keluar_masjid', nama: 'Doa Keluar Masjid', url: 'audio/doa-keluar-masjid.mp3' },
    { id: 'doa_bangun_tidur', nama: 'Doa Bangun Tidur', url: 'audio/doa-bangun-tidur.mp3' },
    { id: 'doa_masuk_wc', nama: 'Doa Masuk WC atau Toilet', url: 'audio/doa-masuk-wc.mp3' },
    { id: 'doa_keluar_wc', nama: 'Doa Keluar WC atau Toilet', url: 'audio/doa-keluar-wc.mp3' },
    { id: 'doa_memakai_pakaian', nama: 'Doa Memakai Pakaian Baru', url: 'audio/doa-memakai-pakaian.mp3' },
    { id: 'doa_melepas_pakaian', nama: 'Doa Melepas Pakaian', url: 'audio/doa-melepas-pakaian.mp3' },
    { id: 'doa_sebelum_wudhu', nama: 'Doa Sebelum Wudhu', url: 'audio/doa-sebelum-wudhu.mp3' },
    { id: 'doa_sesudah_wudhu', nama: 'Doa Sesudah Wudhu', url: 'audio/doa-sesudah-wudhu.mp3' },
    { id: 'doa_keluar_rumah', nama: 'Doa Keluar Rumah', url: 'audio/doa-keluar-rumah.mp3' },
    { id: 'doa_masuk_rumah', nama: 'Doa Masuk Rumah', url: 'audio/doa-masuk-rumah.mp3' },
    { id: 'doa_naik_kendaraan', nama: 'Doa Naik Kendaraan', url: 'audio/doa-naik-kendaraan.mp3' },
    { id: 'doa_cermin', nama: 'Doa Ketika Bercermin', url: 'audio/doa-cermin.mp3' },
    { id: 'doa_masuk_pasar', nama: 'Doa Masuk Pasar', url: 'audio/doa-masuk-pasar.mp3' },
    { id: 'doa_sesudah_makan', nama: 'Doa Sesudah Makan', url: 'audio/doa-sesudah-makan.mp3' },
    { id: 'doa_ketika_hujan', nama: 'Doa Ketika Turun Hujan', url: 'audio/doa-ketika-hujan.mp3' },
    { id: 'doa_ketika_marah', nama: 'Doa Ketika Marah', url: 'audio/doa-ketika-marah.mp3' },
    { id: 'doa_kebaikannya_dunia_akhirat', nama: 'Doa Sapu Jagat (Kebaikan Dunia Akhirat)', url: 'audio/doa-sapu-jagat.mp3' },
    
    // Data Dzikir yang baru dimasukkan ke daftar pencarian
    { id: 'dzikir_pagi', nama: 'Dzikir Pagi', url: 'dzikirpagi.mp3' },
    { id: 'dzikir_petang', nama: 'Dzikir Petang', url: 'dzikirpetang.mp3' }
];

let currentSelectedDoaUrl = "";
let currentSelectedDoaId = "";

function filterDoa() {
    const keyword = document.getElementById('searchDoa').value.toLowerCase().trim();
    const listHasil = document.getElementById('listHasilDoa');
    
    if (keyword === "") {
        listHasil.style.display = "none";
        listHasil.innerHTML = "";
        return;
    }

    const hasil = dataDoaHarian.filter(item => item.nama.toLowerCase().includes(keyword));
    
    listHasil.innerHTML = "";
    if (hasil.length > 0) {
        listHasil.style.display = "block";
        
        hasil.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `🤲 ${item.nama}`;
            li.onclick = function() {
                pilihDoa(item.id, item.nama, item.url);
            };
            listHasil.appendChild(li);
        });
    } else {
        listHasil.style.display = "block";
        listHasil.innerHTML = `<li style="color:var(--teks-redup); cursor:default;">Doa tidak ditemukan</li>`;
    }
}

function pilihDoa(id, nama, url) {
    currentSelectedDoaId = id;
    currentSelectedDoaUrl = url;

    document.getElementById('labelDoaSelected').innerHTML = `🎧 Memutar: <b>${nama}</b>`;
    document.getElementById('listHasilDoa').style.display = 'none';
    document.getElementById('searchDoa').value = nama;

    const audioElem = document.getElementById('audioSearchDoa');
    audioElem.src = url;

    const btn = document.getElementById('btnOfflineDoaSearch');
    const statusText = document.getElementById('statusDoaSearch');
    
    btn.innerHTML = "🌐 Simpan Offline";
    btn.style.background = "";
    btn.style.borderColor = "";
    btn.style.color = "";
    statusText.innerHTML = "Memutar via Streaming";

    if (db) {
        const tx = db.transaction('audiosDoa', 'readonly');
        const store = tx.objectStore('audiosDoa');
        const req = store.get(id);
        req.onsuccess = function() {
            if (req.result) {
                audioElem.src = URL.createObjectURL(req.result);
                btn.innerHTML = "✅ Done";
                btn.style.background = "var(--hijau-card)";
                btn.style.borderColor = "var(--gold)";
                btn.style.color = "var(--gold-terang)";
                statusText.innerHTML = "Audio Siap Di Dengar Tanpa Internet";
            }
        };
    }
}

function simpanDoaSearchOffline() {
    if (!currentSelectedDoaUrl || !currentSelectedDoaId) {
        alert("Pilih salah satu doa dari hasil pencarian terlebih dahulu.");
        return;
    }
    simpanAudioOffline(currentSelectedDoaId, currentSelectedDoaUrl);
}

// Fitur Voice Search (Pencarian Suara)
function mulaiCariSuara() {
    const voiceBtn = document.getElementById('voiceBtn');
    const searchInput = document.getElementById('searchDoa');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        alert("Maaf, browser di HP kamu belum mendukung fitur pencarian suara.");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'id-ID';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = function() {
        voiceBtn.classList.add('listening');
        voiceBtn.innerHTML = "🔴";
        searchInput.placeholder = "Silakan bicara...";
    };

    recognition.onresult = function(event) {
        const hasilSuara = event.results[0][0].transcript;
        searchInput.value = hasilSuara;
        filterDoa();
    };

    recognition.onerror = function(event) {
        console.error("Gagal mendengarkan suara:", event.error);
        resetVoiceUI();
    };

    recognition.onend = function() {
        resetVoiceUI();
    };

    recognition.start();
}

function resetVoiceUI() {
    const voiceBtn = document.getElementById('voiceBtn');
    const searchInput = document.getElementById('searchDoa');
    voiceBtn.classList.remove('listening');
    voiceBtn.innerHTML = "🎙️";
    searchInput.placeholder = "Cari doa atau dzikir (cth: makan, dzikir pagi)...";
}
</script>
