<script>
const htmlElement = document.documentElement;
const themeBtn = document.getElementById('themeToggleBtn');

const savedTheme = localStorage.getItem('quranTheme');
if (savedTheme) {
    htmlElement.setAttribute('data-theme', savedTheme);
    updateThemeButtonText(savedTheme);
}

function toggleTheme() {
    const currentTheme = htmlElement.getAttribute('data-theme');
    if (currentTheme === 'light') {
        htmlElement.removeAttribute('data-theme');
        localStorage.setItem('quranTheme', 'dark');
        updateThemeButtonText('dark');
    } else {
        htmlElement.setAttribute('data-theme', 'light');
        localStorage.setItem('quranTheme', 'light');
        updateThemeButtonText('light');
    }
}

function updateThemeButtonText(theme) {
    if (theme === 'light') {
        themeBtn.innerHTML = '🌙 Ganti ke Mode Gelap';
    } else {
        themeBtn.innerHTML = '☀️ Ganti ke Mode Terang';
    }
}

let listSurah = [];
let modeAktif = 'membaca';
let currentSurahData = null;
let currentAyatIndex = 0;

const customTimestamps = {
    1: {
        1: [0.0, 5.5],
        2: [5.5, 12.0],
        3: [12.0, 17.5],
        4: [17.5, 23.0],
        5: [23.0, 31.0],
        6: [31.0, 39.0],
        7: [39.0, 51.0]
    }
};

let db;

function initApp() {
    const dbReq = indexedDB.open('quranAudioDB', 1);
    dbReq.onupgradeneeded = function(e) {
        db = e.target.result;
        if (!db.objectStoreNames.contains('audios')) {
            db.createObjectStore('audios');
        }
    };
    dbReq.onsuccess = function(e) {
        db = e.target.result;
    };
    ambilDaftarSurah();
}

async function ambilDaftarSurah() {
    try {
        const response = await fetch('https://equran.id/api/v2/surat');
        const result = await response.json();
        listSurah = result.data;
        tampilkanDaftarSurah(listSurah);
    } catch (error) {
        document.getElementById('daftarSurah').innerHTML = '<div class="loading">Gagal memuat daftar surah. Periksa koneksi internet Anda.</div>';
    }
}

function tampilkanDaftarSurah(data) {
    const container = document.getElementById('daftarSurah');
    if (!container) return;
    container.innerHTML = '';

    if (data.length === 0) {
        container.innerHTML = '<div class="loading">Surah tidak ditemukan.</div>';
        return;
    }

    const fragment = document.createDocumentFragment();
    data.forEach(surah => {
        const card = document.createElement('div');
        card.className = 'surah-card';
        card.onclick = () => bukaSurah(surah.nomor);
        card.innerHTML = `
            <div class="surah-info-left">
                <div class="nomor-surah">${surah.nomor}</div>
                <div class="detail-surah">
                    <h3>${surah.namaLatin}</h3>
                    <p>${surah.arti} • ${surah.jumlahAyat} Ayat</p>
                </div>
            </div>
            <div class="nama-arab-list">${surah.nama}</div>
        `;
        fragment.appendChild(card);
    });
    container.appendChild(fragment);
}

async function bukaSurah(nomor) {
    document.getElementById('homeView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    currentAyatIndex = 0;

    document.getElementById('readingFocusView').innerHTML = '<div class="loading">Memuat ayat...</div>';

    try {
        const response = await fetch(`https://equran.id/api/v2/surat/${nomor}`);
        const result = await response.json();
        currentSurahData = result.data;

        document.getElementById('detailSurahTitle').innerText = `Surah ${currentSurahData.namaLatin} (${currentSurahData.jumlahAyat} Ayat)`;
        
        const audioUrl = (currentSurahData.audioFull && currentSurahData.audioFull['05']) || 
                         (currentSurahData.audioFull && Object.values(currentSurahData.audioFull)[0]) || '';
        setupAudioPlayer(audioUrl, currentSurahData.namaLatin);
        
        modeAktif = 'membaca';
        document.getElementById('btnModeMembaca').classList.add('active');
        document.getElementById('btnModeAudio').classList.remove('active');
        document.getElementById('readingFocusView').style.display = 'block';
        document.getElementById('audioListView').style.display = 'none';
        document.getElementById('playerBar').style.display = 'none';

        renderFocusCard();
    } catch (e) {
        document.getElementById('readingFocusView').innerHTML = '<div class="loading">Gagal memuat detail surah.</div>';
    }
}

function kembaliKeHome() {
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('homeView').style.display = 'block';
    document.getElementById('playerBar').style.display = 'none';
    const audio = document.getElementById('mainAudioPlayer');
    audio.pause();
}

function ubahMode(mode) {
    modeAktif = mode;

    document.getElementById('btnModeMembaca').classList.toggle('active', mode === 'membaca');
    document.getElementById('btnModeAudio').classList.toggle('active', mode === 'audio');

    const playerBar = document.getElementById('playerBar');
    const audio = document.getElementById('mainAudioPlayer');

    if (mode === 'membaca') {
        document.getElementById('readingFocusView').style.display = 'block';
        document.getElementById('audioListView').style.display = 'none';
        playerBar.style.display = 'none'; 
        audio.pause();
        renderFocusCard();
    } else {
        document.getElementById('readingFocusView').style.display = 'none';
        document.getElementById('audioListView').style.display = 'block';
        playerBar.style.display = 'block'; 
        renderAudioList();
    }
}

function renderFocusCard() {
    const container = document.getElementById('readingFocusView');
    container.innerHTML = `
        <div style="background: linear-gradient(145deg, var(--hijau-card), var(--hijau-card2)); border: 1px solid var(--border-color); border-radius: 18px; padding: 45px 24px; text-align: center; box-shadow: var(--shadow); margin-top: 10px;">
            <div style="font-size: 36px; margin-bottom: 14px;">🛠️</div>
            <h3 style="font-size: 17px; color: var(--gold-terang); margin-bottom: 8px; font-weight: 700;">Maaf, Mode Membaca Sedang Diperbaiki</h3>
            <p style="font-size: 13px; color: var(--teks-redup); line-height: 1.6; max-width: 500px; margin: 0 auto;">Fitur tampilan teks dan bahasa isyarat sedang dalam tahap pemeliharaan dan pembaruan sistem. Silakan beralih ke <strong>🎧 Mode Audio</strong> di atas untuk mendengarkan bacaan Al-Qur'an.</p>
        </div>
    `;
}

function renderAudioList() {
    if (!currentSurahData) return;
    const container = document.getElementById('audioListView');
    container.innerHTML = '';

    const sliderContainer = document.createElement('div');
    sliderContainer.className = 'audio-horizontal-container';

    currentSurahData.ayat.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'audio-ayat-card-horizontal';
        if (index === currentAyatIndex) {
            card.classList.add('active-audio-highlight');
        }
        card.id = `audio-ayat-${index}`;

        card.innerHTML = `
            <div class="audio-ayat-header">
                <span>Ayat ${item.nomorAyat} dari ${currentSurahData.jumlahAyat}</span>
                <span>${currentSurahData.namaLatin}</span>
            </div>
            <div class="audio-arabic">${item.teksArab}</div>
            <div class="audio-latin">${item.teksLatin}</div>
            <div class="audio-translation">${item.teksIndonesia}</div>
        `;
        sliderContainer.appendChild(card);
    });
    container.appendChild(sliderContainer);

    setTimeout(() => {
        const activeCard = document.getElementById(`audio-ayat-${currentAyatIndex}`);
        if (activeCard) {
            activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
    }, 30);
}

function setupAudioPlayer(defaultUrl, namaLatin) {
    const playerNama = document.getElementById('playerNamaSurah');
    const playerStatus = document.getElementById('playerStatus');
    const audio = document.getElementById('mainAudioPlayer');

    playerNama.innerHTML = `🎧 Surah ${namaLatin}`;
    audio.src = defaultUrl;
    playerStatus.innerHTML = "🌐 Online Streaming";

    audio.ontimeupdate = function() {
        if (modeAktif !== 'audio' || !currentSurahData) return;
        
        const waktuSekarang = audio.currentTime;
        const nomorSurah = currentSurahData.nomor;
        const surahTimestamps = customTimestamps[nomorSurah];

        let indexAktif = 0;
        if (surahTimestamps) {
            currentSurahData.ayat.forEach((item, idx) => {
                const range = surahTimestamps[item.nomorAyat];
                if (range && waktuSekarang >= range[0] && waktuSekarang < range[1]) {
                    indexAktif = idx;
                }
            });
        } else {
            const durasiTotal = audio.duration || 1;
            const jumlahAyat = currentSurahData.ayat.length;
            indexAktif = Math.min(Math.floor((waktuSekarang / durasiTotal) * jumlahAyat), jumlahAyat - 1);
        }

        currentAyatIndex = indexAktif;
        document.querySelectorAll('.audio-ayat-card-horizontal').forEach((el, idx) => {
            if (idx === indexAktif) {
                el.classList.add('active-audio-highlight');
                const activeCard = document.getElementById(`audio-ayat-${indexAktif}`);
                if (activeCard) {
                    activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            } else {
                el.classList.remove('active-audio-highlight');
            }
        });
    };
}

let searchTimeout;
function debounceCariSurah() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        jalankanPencarian();
    }, 200);
}

function normalisasi(teks) {
    return teks.toLowerCase().replace(/[\s\-_']/g, '').replace(/^al/, '');
}

function jalankanPencarian() {
    const rawInput = document.getElementById('searchInput').value.trim();
    const keyword = normalisasi(rawInput);
    const rawKeyword = rawInput.toLowerCase();

    if (!keyword) {
        tampilkanDaftarSurah(listSurah);
        return;
    }

    const hasilFilter = listSurah.filter(surah => {
        return normalisasi(surah.namaLatin).includes(keyword) || 
               normalisasi(surah.arti).includes(keyword) ||
               surah.namaLatin.toLowerCase().includes(rawKeyword) ||
               surah.nomor.toString() === rawInput;
    });

    tampilkanDaftarSurah(hasilFilter);
}

function mulaiPencarianSuara() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("Maaf, browser Anda tidak mendukung fitur pencarian suara.");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'id-ID';
    recognition.interimResults = false;

    const micBtn = document.getElementById('micBtn');
    const micText = document.getElementById('micText');
    const searchInput = document.getElementById('searchInput');

    recognition.onstart = function() {
        micBtn.classList.add('listening');
        micText.innerText = "Mendengarkan...";
    };

    recognition.onresult = function(event) {
        const hasilBicara = event.results[0][0].transcript;
        searchInput.value = hasilBicara.replace(/\.$/, '');
        jalankanPencarian();
    };

    recognition.onerror = function() {
        alert("Gagal mendengarkan suara. Silakan coba lagi.");
    };

    recognition.onend = function() {
        micBtn.classList.remove('listening');
        micText.innerText = "Cari Suara";
    };

    recognition.start();
}
</script>
