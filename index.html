<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodja & Kajian Streaming</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef2f3;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 380px;
            text-align: center;
            margin-bottom: 20px;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fff;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #219653;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .stream-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Bagian Pilihan Live Streaming Radio -->
    <div class="card">
        <h2>Radio Streaming</h2>
        <div class="stream-info">Pilih Channel Kajian Islam & Radio</div>
        
        <!-- Pilihan Channel Radio -->
        <select id="radioChannel" onchange="changeRadio()">
            <option value="https://live.radiorodja.com/stream">Radio Rodja Jakarta (720 AM)</option>
            <option value="https://radiokita.or.id:8000/stream">Radio Rodja Bandung</option>
        </select>

        <audio id="audioPlayer" controls>
            <source src="https://live.radiorodja.com/stream" type="audio/mpeg">
            Browser Anda tidak mendukung pemutar audio.
        </audio>
    </div>

    <!-- Bagian Form Akun -->
    <div class="card">
        <h2>Akun Pengguna</h2>
        <form>
            <input type="text" placeholder="Username atau Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Masuk / Daftar</button>
        </form>
    </div>

<script>
    function changeRadio() {
        const select = document.getElementById('radioChannel');
        const player = document.getElementById('audioPlayer');
        player.src = select.value;
        player.load();
        player.play().catch(e => console.log("Autoplay diblokir browser, silakan tekan play manual."));
    }
</script>

</body>
</html>
