<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodja Streaming & Akun</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef2f3;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 380px;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-card {
            min-height: 290px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden;
            position: relative;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fff;
        }
        button.btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button.btn:hover {
            background: #219653;
        }
        /* Navigasi Kiri (Masuk) & Kanan (Daftar) */
        .nav-switch {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            border-radius: 30px;
            padding: 5px;
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
        }
        .switch-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-weight: bold;
            color: #7f8c8d;
            cursor: pointer;
            font-size: 14px;
            border-radius: 25px;
            transition: all 0.3s ease;
        }
        .switch-btn.active {
            background: #27ae60;
            color: white;
            box-shadow: 0 2px 8px rgba(39, 174, 96, 0.3);
        }
        .form-section {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .form-section.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .stream-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Rodja Streaming</h2>
        <div class="stream-info">Live Streaming Kajian Islam & Radio Rodja</div>
        <audio controls preload="none">
            <source src="https://live.radiorodja.com/stream" type="audio/mpeg">
            Browser Anda tidak mendukung pemutar audio.
        </audio>
    </div>

    <div class="card form-card">
        <div class="nav-switch">
            <button id="btnLoginTab" class="switch-btn active" onclick="switchForm('login')">Masuk</button>
            <button id="btnRegTab" class="switch-btn" onclick="switchForm('register')">Daftar</button>
        </div>

        <div id="loginForm" class="form-section active">
            <h2>Masuk Akun</h2>
            <form onsubmit="handleLogin(event)">
                <input type="text" placeholder="Email / Username" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="btn">Masuk</button>
            </form>
        </div>

        <div id="registerForm" class="form-section">
            <h2>Daftar Akun Baru</h2>
            <form onsubmit="handleRegister(event)">
                <input type="text" placeholder="Nama Lengkap" required>
                <input type="email" placeholder="Email Aktif" required>
                <input type="password" placeholder="Password Baru" required>
                <button type="submit" class="btn">Daftar Sekarang</button>
            </form>
        </div>
    </div>

<script>
    function switchForm(type) {
        const btnLogin = document.getElementById('btnLoginTab');
        const btnReg = document.getElementById('btnRegTab');
        const formLogin = document.getElementById('loginForm');
        const formReg = document.getElementById('registerForm');

        if(type === 'login') {
            btnLogin.classList.add('active');
            btnReg.classList.remove('active');
            formLogin.classList.add('active');
            formReg.classList.remove('active');
        } else {
            btnReg.classList.add('active');
            btnLogin.classList.remove('active');
            formReg.classList.add('active');
            formLogin.classList.remove('active');
        }
    }

    function handleLogin(e) {
        e.preventDefault();
        alert('Fitur login akan segera dihubungkan ke database.');
    }

    function handleRegister(e) {
        e.preventDefault();
        alert('Form pendaftaran berhasil dikirim!');
    }
</script>

</body>
</html>
