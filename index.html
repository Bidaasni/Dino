<title>Al-Qur'an Digital - KitabKu.Online</title>
<meta name="description" content="Baca dan pelajari Al-Qur'an Digital, Doa &amp; Dzikir, Ruqyah Syar'i, Jadwal Sholat, Asmaul Husna, dan Radio Islami dalam satu aplikasi.">
<style>
  :root {
    --hijau-gelap:#081a16; --hijau-tua:#143028; --hijau:#1c3f35;
    --hijau-card:#2a4e41; --hijau-card2:#345c4e;
    --gold:#e3c85a; --gold-terang:#f5e8b5;
    --active-bg:#14382e; --active-text:#f5e8b5; --active-border:#e3c85a;
    --teks:#ffffff; --teks-redup:#c0d4cc;
    --nav-bg: rgba(13,36,30,0.97);
    --border-color: rgba(227,200,90,0.28);
    --shadow: 0 8px 30px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background: var(--hijau-gelap);
    display:flex; flex-direction:column;
    padding-top: env(safe-area-inset-top,0px);
  }

  /* ================================
     MENU NAVIGASI UTAMA (SELALU DI TENGAH: DESKTOP, TABLET, ANDROID)
  ================================ */
  nav.app-nav {
    background: var(--nav-bg);
    display:flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items:center;
    gap:10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-color);
    box-shadow: var(--shadow);
    position: sticky; top:0; z-index: 500;
    backdrop-filter: blur(10px);
  }
  .menu-btn {
    flex: 0 0 auto;
    min-width: 110px;
    padding: 10px 16px;
    text-align:center;
    color: var(--teks-redup);
    font-weight:600; font-size:13px;
    background: rgba(42,78,65,0.15);
    border:1px solid var(--border-color);
    border-radius:30px;
    cursor:pointer;
    transition: all 0.25s ease;
    font-family: inherit;
  }
  .menu-btn:hover { background: rgba(42,78,65,0.3); }
  .menu-btn.active {
    background: var(--active-bg) !important;
    color: var(--active-text) !important;
    border-color: var(--active-border) !important;
    font-weight:700;
  }

  .frame-wrap {
    flex: 1 1 auto;
    position:relative;
    min-height:0;
  }
  .page-frame {
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    border:none;
    display:none;
    background: var(--hijau-gelap);
  }
  .page-frame.active { display:block; }

  .loading-msg {
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    color: var(--teks-redup); font-size:14px;
  }

  @media (max-width: 480px) {
    .menu-btn { min-width: 90px; padding:8px 12px; font-size:12px; }
    nav.app-nav { gap:8px; padding:10px 12px; }
  }
</style>
</head>

const loadedFrames = {};
let currentPage = null;

function showPage(key) {
  if (!pages[key]) return;

  // update tombol menu aktif
  document.querySelectorAll('.menu-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-page') === key);
  });

  const wrap = document.getElementById('frameWrap');

  // sembunyikan frame yang sedang tampil
  Object.keys(loadedFrames).forEach(k => {
    loadedFrames[k].classList.remove('active');
  });

  // buat iframe jika belum pernah dibuka (lazy-load agar tiap halaman tetap berjalan independen)
  if (!loadedFrames[key]) {
    const iframe = document.createElement('iframe');
    iframe.className = 'page-frame';
    iframe.setAttribute('title', key);
    iframe.srcdoc = atob(pages[key]);
    wrap.appendChild(iframe);
    loadedFrames[key] = iframe;
  }

  loadedFrames[key].classList.add('active');
  currentPage = key;
}

// buka halaman pertama saat load
showPage('home');
</script>
