<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mixer Warna</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f3;
            margin: 0;
            padding: 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .card {
            width: 100%;
            max-width: 460px;

            background: white;
            padding: 25px;

            border-radius: 16px;

            box-shadow:
                0 4px 20px rgba(0,0,0,0.08);

            text-align: center;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 5px;
            color: #2c3e50;
        }

        .deskripsi {
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .mixer-grid {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .color-picker-box {
            flex: 1;

            background: #f8fafc;

            border: 2px solid #e2e8f0;

            border-radius: 12px;

            padding: 12px;
        }

        .operator {
            font-size: 25px;
            font-weight: bold;
            color: #94a3b8;
        }

        .manual-input {
            width: 100%;

            padding: 8px;

            margin-bottom: 7px;

            border:
                1px solid #cbd5e1;

            border-radius: 7px;

            font-size: 11px;

            text-align: center;

            outline: none;
        }

        .manual-input:focus {
            border-color: #27ae60;
        }

        .wheel-container {
            width: 120px;
            height: 120px;

            margin:
                8px auto;

            position: relative;

            cursor: crosshair;
        }

        canvas {
            width: 120px;
            height: 120px;

            border-radius: 50%;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.15);

            touch-action: none;
        }

        .info-warna {
            min-height: 55px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            font-size: 11px;

            margin-bottom: 8px;
        }

        .btn-upload {
            width: 100%;

            padding: 8px;

            border: none;

            border-radius: 7px;

            background: #27ae60;

            color: white;

            font-size: 11px;

            font-weight: bold;

            cursor: pointer;
        }

        .btn-upload:hover {
            background: #219653;
        }

        .hidden-input {
            display: none;
        }

        .result-section {
            margin-top: 20px;

            padding-top: 15px;

            border-top:
                2px dashed #e2e8f0;
        }

        .result-title {
            font-size: 14px;

            font-weight: bold;

            color: #475569;

            margin-bottom: 10px;
        }

        .result-box {
            min-height: 100px;

            padding: 18px;

            border-radius: 12px;

            background: #808080;

            color: white;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-shadow:
                1px 1px 3px rgba(0,0,0,0.5);

            transition:
                background-color 0.3s;
        }

        .nama-hasil {
            font-size: 21px;
            font-weight: bold;
        }

        .kode-hasil {
            font-size: 12px;
            margin-top: 5px;
        }

        .rgb-hasil {
            font-size: 11px;
            margin-top: 3px;
        }

        .petunjuk {
            font-size: 10px;
            color: #888;
            margin-top: 15px;
        }

        @media (max-width: 380px) {

            .card {
                padding: 15px;
            }

            .mixer-grid {
                gap: 7px;
            }

            .operator {
                font-size: 20px;
            }

            .wheel-container,
            canvas {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <h2>🎨 Mixer Roda Warna</h2>

    <div class="deskripsi">
        Ketik nama, HEX, RGB, pilih roda warna, atau upload foto.
    </div>


    <!-- =================================================
         DUA WARNA
    ================================================== -->

    <div class="mixer-grid">


        <!-- ================= WARNA 1 ================= -->

        <div class="color-picker-box">

            <input
                type="text"
                id="inputNama1"
                class="manual-input"
                placeholder="Nama warna"
                autocomplete="off"
            >

            <input
                type="text"
                id="inputManual1"
                class="manual-input"
                placeholder="#HEX / RGB"
                autocomplete="off"
            >

            <div class="wheel-container">

                <canvas
                    id="wheel1"
                    width="200"
                    height="200">
                </canvas>

            </div>

            <div
                id="info1"
                class="info-warna">

                <span>Belum dipilih</span>

            </div>

            <button
                class="btn-upload"
                onclick="document.getElementById('file1').click()">

                📁 Upload Foto 1

            </button>

            <input
                type="file"
                id="file1"
                class="hidden-input"
                accept="image/*"
            >

        </div>


        <!-- TANDA + -->

        <div class="operator">
            +
        </div>


        <!-- ================= WARNA 2 ================= -->

        <div class="color-picker-box">

            <input
                type="text"
                id="inputNama2"
                class="manual-input"
                placeholder="Nama warna"
                autocomplete="off"
            >

            <input
                type="text"
                id="inputManual2"
                class="manual-input"
                placeholder="#HEX / RGB"
                autocomplete="off"
            >

            <div class="wheel-container">

                <canvas
                    id="wheel2"
                    width="200"
                    height="200">
                </canvas>

            </div>

            <div
                id="info2"
                class="info-warna">

                <span>Belum dipilih</span>

            </div>

            <button
                class="btn-upload"
                onclick="document.getElementById('file2').click()">

                📁 Upload Foto 2

            </button>

            <input
                type="file"
                id="file2"
                class="hidden-input"
                accept="image/*"
            >

        </div>

    </div>


    <!-- =================================================
         HASIL
    ================================================== -->

    <div class="result-section">

        <div class="result-title">
            ✨ Hasil Gabungan Warna ✨
        </div>

        <div
            id="resultBox"
            class="result-box">

            <div
                id="namaHasil"
                class="nama-hasil">

                Belum Dicampur

            </div>

            <div
                id="kodeHasil"
                class="kode-hasil">

                Tentukan kedua warna

            </div>

            <div
                id="rgbHasil"
                class="rgb-hasil">

            </div>

        </div>

    </div>


    <div class="petunjuk">
        Contoh: merah + ungu → warna hasil
    </div>

</div>


<script>

/* =========================================================
   DATA WARNA
========================================================= */

const kamusWarna = {

    /* WARNA DASAR */

    "merah": "#FF0000",
    "red": "#FF0000",

    "hijau": "#008000",
    "green": "#008000",

    "biru": "#0000FF",
    "blue": "#0000FF",

    "kuning": "#FFFF00",
    "yellow": "#FFFF00",

    "coklat": "#A52A2A",

    "abu abu": "#808080",
    "gray": "#808080",
    "grey": "#808080",


    /* WARNA LAIN */

    "cyan": "#00FFFF",
    "aqua": "#00FFFF",

    "toska": "#40E0D0",
    "turquoise": "#40E0D0",

    "magenta": "#FF00FF",
    "fuchsia": "#FF00FF",

    "violet": "#EE82EE",

    "lavender": "#E6E6FA",

    "maroon": "#800000",
    "merah tua": "#800000",

    "biru tua": "#000080",

    "teal": "#008080",

    "lime": "#00FF00",

    "olive": "#808000",

    "silver": "#C0C0C0",
    "perak": "#C0C0C0",

    "gold": "#FFD700",
    "emas": "#FFD700",

    "coral": "#FF7F50",

    "salmon": "#FA8072",

    "crimson": "#DC143C",

    "scarlet": "#FF2400",

    "indigo": "#4B0082",
    "nila": "#4B0082",

    "beige": "#F5F5DC",
    "krem": "#FFFDD0",

    "khaki": "#F0E68C",

    "plum": "#DDA0DD",

    "tan": "#D2B48C",

    "chocolate": "#D2691E",

    "tomato": "#FF6347",

    "oranye tua": "#FF8C00",

    "hijau tua": "#006400",

    "hijau muda": "#90EE90",

    "biru muda": "#ADD8E6",

    "biru langit": "#87CEEB",
    "sky blue": "#87CEEB",

    "pink tua": "#FF1493",

    "deep pink": "#FF1493",

    "rose": "#FF007F",
    "mawar": "#FF007F",

    "mint": "#98FF98",

    "emerald": "#50C878",
    "zamrud": "#50C878",

    "peach": "#FFE5B4",
    "persik": "#FFE5B4",

    "bronze": "#CD7F32",
    "perunggu": "#CD7F32",

    "ruby": "#E0115F",
    "rubi": "#E0115F"
};


/* =========================================================
   WARNA AWAL
========================================================= */

let rgb1 = [255, 0, 0];

let rgb2 = [0, 0, 255];

let activeWheel = null;


/* =========================================================
   NORMALISASI
========================================================= */

function normalisasiNama(nama) {

    return nama
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
}


/* =========================================================
   HEX → RGB
========================================================= */

function hexToRgb(hex) {

    hex = hex
        .trim()
        .replace("#", "");

    /* HEX 3 DIGIT */

    if (/^[0-9a-fA-F]{3}$/.test(hex)) {

        hex = hex
            .split("")
            .map(function(x) {
                return x + x;
            })
            .join("");
    }


    /* HEX 6 DIGIT */

    if (!/^[0-9a-fA-F]{6}$/.test(hex)) {

        return null;
    }


    return [

        parseInt(hex.substring(0, 2), 16),

        parseInt(hex.substring(2, 4), 16),

        parseInt(hex.substring(4, 6), 16)

    ];
}


/* =========================================================
   RGB → HEX
========================================================= */

function rgbToHex(r, g, b) {

    r = Math.max(
        0,
        Math.min(255, Math.round(r))
    );

    g = Math.max(
        0,
        Math.min(255, Math.round(g))
    );

    b = Math.max(
        0,
        Math.min(255, Math.round(b))
    );


    return "#" +

        r.toString(16).padStart(2, "0") +

        g.toString(16).padStart(2, "0") +

        b.toString(16).padStart(2, "0");
}


/* =========================================================
   RGB INPUT
========================================================= */

function rgbInputToArray(input) {

    const match = input.match(
        /^rgb\s*\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)$/i
    );


    if (!match) {

        return null;
    }


    const r = Number(match[1]);

    const g = Number(match[2]);

    const b = Number(match[3]);


    if (
        r > 255 ||
        g > 255 ||
        b > 255
    ) {

        return null;
    }


    return [r, g, b];
}


/* =========================================================
   CARI NAMA WARNA
========================================================= */

function cariWarnaDenganNama(nama) {

    nama = normalisasiNama(nama);

    return kamusWarna[nama] || null;
}


/* =========================================================
   NAMA WARNA TERDEKAT
========================================================= */

function tentukanNamaWarna(r, g, b) {

    let namaTerdekat = "Warna khusus";

    let hexTerdekat = null;

    let jarakTerkecil = Infinity;


    for (
        const nama in kamusWarna
    ) {

        const hex =
            kamusWarna[nama];

        const rgb =
            hexToRgb(hex);


        if (!rgb) continue;


        const dr =
            r - rgb[0];

        const dg =
            g - rgb[1];

        const db =
            b - rgb[2];


        const jarak =
            (dr * dr) +
            (dg * dg) +
            (db * db);


        if (
            jarak <
            jarakTerkecil
        ) {

            jarakTerkecil =
                jarak;

            namaTerdekat =
                nama;

            hexTerdekat =
                hex;
        }
    }


    return {

        nama:
            formatNamaWarna(
                namaTerdekat
            ),

        hex:
            hexTerdekat
    };
}


/* =========================================================
   FORMAT NAMA
========================================================= */

function formatNamaWarna(nama) {

    const terjemahan = {

        "red": "Merah",

        "green": "Hijau",

        "blue": "Biru",

        "yellow": "Kuning",

        "purple": "Ungu",

        "pink": "Pink",

        "orange": "Orange",

        "oranye": "Orange",

        "brown": "Cokelat",

        "white": "Putih",

        "black": "Hitam",

        "gray": "Abu-abu",

        "grey": "Abu-abu",

        "cyan": "Cyan",

        "magenta": "Magenta",

        "violet": "Violet",

        "turquoise": "Toska",

        "gold": "Emas",

        "silver": "Perak",

        "indigo": "Indigo",

        "maroon": "Maroon",

        "navy": "Navy"

    };


    if (terjemahan[nama]) {

        return terjemahan[nama];
    }


    return nama
        .split(" ")
        .map(function(kata) {

            return kata
                .charAt(0)
                .toUpperCase() +
                kata.slice(1);

        })
        .join(" ");
}


/* =========================================================
   TERAPKAN WARNA
========================================================= */

function terapkanWarna(rgb, nomor) {

    if (!rgb) return;


    if (nomor === 1) {

        rgb1 = rgb;

    } else {

        rgb2 = rgb;
    }


    const hex =
        rgbToHex(
            rgb[0],
            rgb[1],
            rgb[2]
        );


    document.getElementById(
        "inputManual" + nomor
    ).value = hex;


    updateInfoWarna(nomor);

    hitungCampuran();
}


/* =========================================================
   INPUT NAMA
========================================================= */

function prosesInputNama(nomor) {

    const input =
        document.getElementById(
            "inputNama" + nomor
        );


    const nama =
        normalisasiNama(
            input.value
        );


    const hex =
        cariWarnaDenganNama(
            nama
        );


    if (!hex) return;


    const rgb =
        hexToRgb(hex);


    terapkanWarna(
        rgb,
        nomor
    );
}


/* =========================================================
   INPUT HEX / RGB
========================================================= */

function prosesInputManual(nomor) {

    let input =
        document.getElementById(
            "inputManual" + nomor
        ).value.trim();


    if (!input) return;


    /* COBA RGB */

    const rgb =
        rgbInputToArray(input);


    if (rgb) {

        terapkanWarna(
            rgb,
            nomor
        );

        return;
    }


    /* COBA HEX */

    if (
        !input.startsWith("#")
    ) {

        input =
            "#" + input;
    }


    const rgbHex =
        hexToRgb(input);


    if (rgbHex) {

        terapkanWarna(
            rgbHex,
            nomor
        );
    }
}


/* =========================================================
   UPDATE INFO WARNA
========================================================= */

function updateInfoWarna(nomor) {

    const rgb =
        nomor === 1
            ? rgb1
            : rgb2;


    const hex =
        rgbToHex(
            rgb[0],
            rgb[1],
            rgb[2]
        );


    const hasilNama =
        tentukanNamaWarna(
            rgb[0],
            rgb[1],
            rgb[2]
        );


    const info =
        document.getElementById(
            "info" + nomor
        );


    info.innerHTML = `

        <span style="
            color:${hex};
            font-weight:bold;
        ">
            ${hasilNama.nama}
        </span>

        <span style="
            color:#555;
            font-size:9px;
        ">
            ${hex.toUpperCase()}
        </span>

        <span style="
            color:#777;
            font-size:9px;
        ">
            RGB(${rgb[0]}, ${rgb[1]}, ${rgb[2]})
        </span>

    `;
}


/* =========================================================
   CAMPUR WARNA
========================================================= */

function hitungCampuran() {

    /*
       PENCAMPURAN RGB DIGITAL

       Warna 1 + Warna 2
       masing-masing channel
       dirata-ratakan.
    */


    const r =
        Math.round(
            (rgb1[0] + rgb2[0]) / 2
        );


    const g =
        Math.round(
            (rgb1[1] + rgb2[1]) / 2
        );


    const b =
        Math.round(
            (rgb1[2] + rgb2[2]) / 2
        );


    const hasilHex =
        rgbToHex(r, g, b);


    const hasilNama =
        tentukanNamaWarna(
            r,
            g,
            b
        );


    document.getElementById(
        "resultBox"
    ).style.backgroundColor =
        hasilHex;


    document.getElementById(
        "namaHasil"
    ).innerText =
        hasilNama.nama;


    document.getElementById(
        "kodeHasil"
    ).innerText =
        "HEX: " +
        hasilHex.toUpperCase();


    document.getElementById(
        "rgbHasil"
    ).innerText =
        "RGB: (" +
        r + ", " +
        g + ", " +
        b + ")";
}


/* =========================================================
   MEMBUAT RODA WARNA
========================================================= */

function drawColorWheel(canvasId) {

    const canvas =
        document.getElementById(
            canvasId
        );


    const ctx =
        canvas.getContext("2d");


    const radius = 100;


    for (
        let x = -radius;
        x <= radius;
        x++
    ) {

        for (
            let y = -radius;
            y <= radius;
            y++
        ) {

            const distance =
                Math.sqrt(
                    x * x +
                    y * y
                );


            if (
                distance <= radius
            ) {

                let angle =
                    Math.atan2(y, x) *
                    180 /
                    Math.PI;


                if (
                    angle < 0
                ) {

                    angle += 360;
                }


                const saturation =
                    distance / radius;


                const lightness =
                    0.5;


                const hex =
                    hslToHex(
                        angle,
                        saturation,
                        lightness
                    );


                ctx.fillStyle =
                    hex;


                ctx.fillRect(
                    x + radius,
                    y + radius,
                    1,
                    1
                );
            }
        }
    }
}


/* =========================================================
   HSL → HEX
========================================================= */

function hslToHex(h, s, l) {

    const c =
        (1 -
            Math.abs(
                2 * l - 1
            )
        ) * s;


    const x =
        c *
        (
            1 -
            Math.abs(
                (h / 60) % 2 - 1
            )
        );


    const m =
        l - c / 2;


    let r = 0;

    let g = 0;

    let b = 0;


    if (h < 60) {

        r = c;
        g = x;

    }

    else if (h < 120) {

        r = x;
        g = c;

    }

    else if (h < 180) {

        g = c;
        b = x;

    }

    else if (h < 240) {

        g = x;
        b = c;

    }

    else if (h < 300) {

        r = x;
        b = c;

    }

    else {

        r = c;
        b = x;
    }


    r =
        Math.round(
            (r + m) * 255
        );


    g =
        Math.round(
            (g + m) * 255
        );


    b =
        Math.round(
            (b + m) * 255
        );


    return rgbToHex(
        r,
        g,
        b
    );
}


/* =========================================================
   INTERAKSI RODA WARNA
========================================================= */

function setupWheel(
    canvasId,
    nomor
) {

    const canvas =
        document.getElementById(
            canvasId
        );


    function pilihWarna(e) {

        const rect =
            canvas.getBoundingClientRect();


        let clientX;

        let clientY;


        if (
            e.touches &&
            e.touches.length
        ) {

            clientX =
                e.touches[0].clientX;

            clientY =
                e.touches[0].clientY;

        } else {

            clientX =
                e.clientX;

            clientY =
                e.clientY;
        }


        const x =
            Math.floor(
                (
                    clientX -
                    rect.left
                ) *
                canvas.width /
                rect.width
            );


        const y =
            Math.floor(
                (
                    clientY -
                    rect.top
                ) *
                canvas.height /
                rect.height
            );


        if (
            x < 0 ||
            y < 0 ||
            x >= canvas.width ||
            y >= canvas.height
        ) {

            return;
        }


        const ctx =
            canvas.getContext("2d");


        const pixel =
            ctx.getImageData(
                x,
                y,
                1,
                1
            ).data;


        if (
            pixel[3] === 0
        ) {

            return;
        }


        terapkanWarna(
            [
                pixel[0],
                pixel[1],
                pixel[2]
            ],
            nomor
        );
    }


    canvas.addEventListener(
        "mousedown",
        function(e) {

            activeWheel =
                nomor;

            pilihWarna(e);
        }
    );


    window.addEventListener(
        "mousemove",
        function(e) {

            if (
                activeWheel === nomor
            ) {

                pilihWarna(e);
            }
        }
    );


    window.addEventListener(
        "mouseup",
        function() {

            activeWheel =
                null;
        }
    );


    canvas.addEventListener(
        "touchstart",
        function(e) {

            activeWheel =
                nomor;

            pilihWarna(e);

            e.preventDefault();

        },
        {
            passive: false
        }
    );


    canvas.addEventListener(
        "touchmove",
        function(e) {

            if (
                activeWheel === nomor
            ) {

                pilihWarna(e);
            }

            e.preventDefault();

        },
        {
            passive: false
        }
    );


    canvas.addEventListener(
        "touchend",
        function() {

            activeWheel =
                null;
        }
    );
}


/* =========================================================
   UPLOAD FOTO
========================================================= */

function setupUpload(
    inputId,
    nomor
) {

    const input =
        document.getElementById(
            inputId
        );


    input.addEventListener(
        "change",
        function(e) {

            const file =
                e.target.files[0];


            if (!file) return;


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    const img =
                        new Image();


                    img.onload =
                        function() {

                                document.createElement(
                                    "canvas"
                                );


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            canvas.width = 50;

                            canvas.height = 50;


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                50,
                                50
                            );


                            const pixel =
                                ctx.getImageData(
                                    25,
                                    25,
                                    1,
                                    1
                                ).data;


                            terapkanWarna(
                                [
                                    pixel[0],
                                    pixel[1],
                                    pixel[2]
                                ],
                                nomor
                            );
                        };


                    img.src =
                        event.target.result;
                };


            reader.readAsDataURL(file);
        }
    );
