<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencampur Warna Foto Otomatis</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef2f3;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-top: 0; margin-bottom: 8px; font-size: 22px; }
        p { font-size: 13px; color: #666; margin-bottom: 25px; }

        .upload-section {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
        }
        .upload-box {
            flex: 1;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            background: #f8fafc;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-box:hover {
            border-color: #27ae60;
            background: #f0fdf4;
        }
        .upload-box input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .preview-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 8px;
            display: none;
            border: 2px solid #27ae60;
        }
        .upload-label {
            font-size: 13px;
            font-weight: bold;
            color: #475569;
        }
        .operator {
            font-size: 24px;
            font-weight: bold;
            color: #94a3b8;
            align-self: center;
        }

        /* Kotak Hasil */
        .result-box {
            padding: 20px;
            border-radius: 12px;
            background-color: #cbd5e1;
            color: white;
            transition: background-color 0.4s ease;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }
        .nama-warna {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .kode-warna {
            font-size: 13px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Mixer Warna Foto</h2>
        <p>Unggah 2 foto berbeda untuk melihat hasil pencampuran warna dominannya secara otomatis!</p>
        
        <div class="upload-section">
            <!-- Upload Foto 1 -->
            <div class="upload-box">
                <img id="preview1" class="preview-img" alt="Preview 1">
                <div id="label1" class="upload-label">📁 Upload Foto 1</div>
                <input type="file" accept="image/*" onchange="prosesFoto(event, 1)">
            </div>

            <div class="operator">+</div>

            <!-- Upload Foto 2 -->
            <div class="upload-box">
                <img id="preview2" class="preview-img" alt="Preview 2">
                <div id="label2" class="upload-label">📁 Upload Foto 2</div>
                <input type="file" accept="image/*" onchange="prosesFoto(event, 2)">
            </div>
        </div>

        <!-- Hasil Pencampuran -->
        <div id="resultBox" class="result-box">
            <div id="namaHasil" class="nama-warna">Menunggu Foto...</div>
            <div id="kodeHasil" class="kode-warna">Silakan unggah kedua foto di atas</div>
        </div>
    </div>

<script>
    // Menyimpan rata-rata warna RGB dari masing-masing foto
    let warnaFoto1 = null;
    let warnaFoto2 = null;

    // Referensi kamus nama warna dasar
    const referensiWarna = [
        { nama: "🔴 Merah", rgb: [255, 0, 0] },
        { nama: "🟠 Orange", rgb: [255, 128, 0] },
        { nama: "🟡 Kuning", rgb: [255, 255, 0] },
        { nama: "🟢 Hijau", rgb: [0, 128, 0] },
        { nama: "🔵 Biru", rgb: [0, 0, 255] },
        { nama: "🟣 Ungu", rgb: [128, 0, 128] },
        { nama: "🌸 Pink", rgb: [255, 105, 180] },
        { nama: "🟤 Cokelat", rgb: [139, 69, 19] },
        { nama: "⚫ Hitam", rgb: [0, 0, 0] },
        { nama: "⚪ Putih", rgb: [255, 255, 255] },
        { nama: "🔘 Abu-abu", rgb: [128, 128, 128] },
        { nama: "🩵 Toska / Cyan", rgb: [0, 255, 255] }
    ];

    function prosesFoto(event, nomor) {
        const file = event.target.files[0];
        if (!file) return;

        // Tampilkan gambar kecil (preview) di kotak upload
        const reader = new FileReader();
        reader.onload = function(e) {
            const imgElement = document.getElementById(`preview${nomor}`);
            const labelElement = document.getElementById(`label${nomor}`);
            
            imgElement.src = e.target.result;
            imgElement.style.display = "block";
            labelElement.style.display = "none"; // Sembunyikan teks upload agar rapi

            // Ekstraksi warna rata-rata dari gambar menggunakan Canvas tersembunyi
            const img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 50; // Ukuran diperkecil agar prosesnya sangat cepat
                canvas.height = 50;
                
                ctx.drawImage(img, 0, 0, 50, 50);
                const imageData = ctx.getImageData(0, 0, 50, 50).data;
                
                let rTotal = 0, gTotal = 0, bTotal = 0, totalPiksel = 0;
                
                // Hitung rata-rata seluruh piksel dalam foto
                for (let i = 0; i < imageData.length; i += 4) {
                    rTotal += imageData[i];
                    gTotal += imageData[i+1];
                    bTotal += imageData[i+2];
                    totalPiksel++;
                }

                const avgR = Math.floor(rTotal / totalPiksel);
                const avgG = Math.floor(gTotal / totalPiksel);
                const avgB = Math.floor(bTotal / totalPiksel);

                if (nomor === 1) warnaFoto1 = [avgR, avgG, avgB];
                if (nomor === 2) warnaFoto2 = [avgR, avgG, avgB];

                // Jika kedua foto sudah diunggah, lakukan pencampuran otomatis!
                if (warnaFoto1 && warnaFoto2) {
                    hitungCampuranWarna();
                }
            }
        }
        reader.readAsDataURL(file);
    }

    function hitungCampuranWarna() {
        // Rumus rata-rata pencampuran RGB foto 1 dan foto 2
        let rMix = Math.floor((warnaFoto1[0] + warnaFoto2[0]) / 2);
        let gMix = Math.floor((warnaFoto1[1] + warnaFoto2[1]) / 2);
        let bMix = Math.floor((warnaFoto1[2] + warnaFoto2[2]) / 2);

        // Ubah ke format HEX
        let hasilHex = "#" + ((1 << 24) + (rMix << 16) + (gMix << 8) + bMix).toString(16).slice(1);

        // Cocokkan dengan nama warna terdekat
        let namaOtomatis = cariNamaWarna(rMix, gMix, bMix);

        // Tampilkan hasilnya di web
        let box = document.getElementById("resultBox");
        box.style.backgroundColor = hasilHex;
        document.getElementById("namaHasil").innerText = namaOtomatis;
        document.getElementById("kodeHasil").innerText = "Kode: " + hasilHex.toUpperCase();
    }

    function cariNamaWarna(r, g, b) {
        let terdekat = referensiWarna[0];
        let jarakTerkecil = Infinity;

        for (let w of referensiWarna) {
            let dr = r - w.rgb[0];
            let dg = g - w.rgb[1];
            let db = b - w.rgb[2];
            let jarak = Math.sqrt(dr * dr + dg * dg + db * db);
            
            if (jarak < jarakTerkecil) {
                jarakTerkecil = jarak;
                terdekat = w;
            }
        }
        return terdekat.nama;
    }
</script>

</body>
</html>
