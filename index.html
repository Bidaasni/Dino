<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodja Streaming & Akun</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef2f3;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 380px;
            text-align: center;
            margin-bottom: 20px;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fff;
        }
        button.btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button.btn:hover {
            background: #219653;
        }
        .tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-weight: bold;
            color: #7f8c8d;
            cursor: pointer;
            font-size: 15px;
        }
        .tab-btn.active {
            color: #27ae60;
            border-bottom: 2px solid #27ae60;
            margin-bottom: -2px;
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .stream-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Bagian Radio Streaming Tunggal -->
    <div class="card">
        <h2>Rodja Streaming</h2>
        <div class="stream-info">Live Streaming Kajian Islam & Radio Rodja</div>
        <audio controls preload="none">
            <source src="https://live.radiorodja.com/stream" type="audio/mpeg">
            Browser Anda tidak mendukung pemutar audio.
        </audio>
    </div>

    <!-- Bagian Login & Register -->
    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Masuk</button>
            <button class="tab-btn" onclick="switchTab('register')">Daftar</button>
        </div>

        <!-- Form Masuk (Login) -->
        <div id="loginForm" class="form-section active">
            <h2>Masuk Akun</h2>
            <form onsubmit="handleLogin(event)">
                <input type="text" placeholder="Email / Username" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="btn">Masuk</button>
            </form>
        </div>

        <!-- Form Daftar (Register) -->
        <div id="registerForm" class="form-section">
            <h2>Daftar Akun Baru</h2>
            <form onsubmit="handleRegister(event)">
                <input type="text" placeholder="Nama Lengkap" required>
                <input type="email" placeholder="Email Aktif" required>
                <input type="password" placeholder="Password Baru" required>
                <button type="submit" class="btn">Daftar Sekarang</button>
            </form>
        </div>
    </div>

<script>
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
        
        if(tabName === 'login') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('loginForm').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('registerForm').classList.add('active');
        }
    }

    function handleLogin(e) {
        e.preventDefault();
        alert('Fitur login akan segera dihubungkan ke database.');
    }

    function handleRegister(e) {
        e.preventDefault();
        alert('Form pendaftaran berhasil dikirim!');
    }
</script>

</body>
</html>
