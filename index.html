/* =========================================================
   NORMALISASI NAMA
========================================================= */

function normalisasiNama(nama) {
    return nama
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
}


/* =========================================================
   HEX → RGB
========================================================= */

function hexToRgb(hex) {

    hex = hex.trim().replace("#", "");

    // HEX 3 digit
    if (/^[0-9a-fA-F]{3}$/.test(hex)) {
        hex = hex.split("")
            .map(x => x + x)
            .join("");
    }

    if (!/^[0-9a-fA-F]{6}$/.test(hex)) {
        return null;
    }

    return [
        parseInt(hex.substring(0, 2), 16),
        parseInt(hex.substring(2, 4), 16),
        parseInt(hex.substring(4, 6), 16)
    ];
}


/* =========================================================
   RGB → HEX
========================================================= */

function rgbToHex(r, g, b) {

    return "#" +
        [r, g, b]
        .map(x => Math.max(0, Math.min(255, Math.round(x)))
        .toString(16)
        .padStart(2, "0"))
        .join("");
}


/* =========================================================
   RGB INPUT
   contoh:
   rgb(255, 0, 0)
========================================================= */

function rgbInputToArray(input) {

    const match = input.match(
        /^rgb\s*\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)$/i
    );

    if (!match) return null;

    const r = Number(match[1]);
    const g = Number(match[2]);
    const b = Number(match[3]);

    if (r > 255 || g > 255 || b > 255) {
        return null;
    }

    return [r, g, b];
}


/* =========================================================
   NAMA → HEX
========================================================= */

function cariWarnaDenganNama(nama) {

    nama = normalisasiNama(nama);

    return kamusWarna[nama] || null;
}


/* =========================================================
   WARNA TERDEKAT
   Menggunakan jarak RGB.
   
   Ini jauh lebih akurat daripada hanya melihat hue.
========================================================= */

function tentukanNamaWarna(r, g, b) {

    let warnaTerdekat = "Warna khusus";
    let hexTerdekat = null;
    let jarakTerkecil = Infinity;

    for (const [nama, hex] of Object.entries(kamusWarna)) {

        const rgb = hexToRgb(hex);

        if (!rgb) continue;

        const dr = r - rgb[0];
        const dg = g - rgb[1];
        const db = b - rgb[2];

        const jarak =
            dr * dr +
            dg * dg +
            db * db;

        if (jarak < jarakTerkecil) {

            jarakTerkecil = jarak;
            warnaTerdekat = nama;
            hexTerdekat = hex;
        }
    }

    return {
        nama: formatNamaWarna(warnaTerdekat),
        hexReferensi: hexTerdekat,
        jarak: Math.sqrt(jarakTerkecil)
    };
}


/* =========================================================
   FORMAT NAMA
========================================================= */

function formatNamaWarna(nama) {

    const namaIndo = {
        "red": "Merah",
        "green": "Hijau",
        "blue": "Biru",
        "yellow": "Kuning",
        "purple": "Ungu",
        "orange": "Orange",
        "oranye": "Orange",
        "pink": "Pink",
        "brown": "Cokelat",
        "white": "Putih",
        "black": "Hitam",
        "gray": "Abu-abu",
        "grey": "Abu-abu",
        "cyan": "Cyan",
        "magenta": "Magenta",
        "violet": "Violet",
        "navy": "Navy",
        "teal": "Teal",
        "lime": "Lime",
        "gold": "Emas",
        "silver": "Perak",
        "coral": "Coral",
        "salmon": "Salmon",
        "indigo": "Indigo",
        "lavender": "Lavender",
        "maroon": "Maroon",
        "olive": "Olive",
        "turquoise": "Toska"
    };

    if (namaIndo[nama]) {
        return namaIndo[nama];
    }

    return nama
        .split(" ")
        .map(kata =>
            kata.charAt(0).toUpperCase() +
            kata.slice(1)
        )
        .join(" ");
}


/* =========================================================
   TERAPKAN WARNA DARI RGB
========================================================= */

function terapkanWarna(rgb, nomor) {

    if (!rgb) return;

    if (nomor === 1) {
        rgb1 = rgb;
    } else {
        rgb2 = rgb;
    }

    const hex = rgbToHex(rgb[0], rgb[1], rgb[2]);

    document.getElementById(
        `inputManual${nomor}`
    ).value = hex;

    updateInfoWarna(nomor);
    hitungCampuran();
}


/* =========================================================
   INPUT NAMA
========================================================= */

function prosesInputNama(nomor) {

    const input =
        document.getElementById(`inputNama${nomor}`);

    const nama =
        normalisasiNama(input.value);

    const hex =
        cariWarnaDenganNama(nama);

    if (!hex) return;

    const rgb =
        hexToRgb(hex);

    terapkanWarna(rgb, nomor);
}


/* =========================================================
   INPUT HEX / RGB
========================================================= */

function prosesInputManual(nomor) {

    let input =
        document.getElementById(`inputManual${nomor}`)
        .value
        .trim();

    if (!input) return;


    /* RGB */
    const rgb =
        rgbInputToArray(input);

    if (rgb) {

        terapkanWarna(rgb, nomor);
        return;
    }


    /* HEX */
    if (!input.startsWith("#")) {
        input = "#" + input;
    }

    const rgbHex =
        hexToRgb(input);

    if (rgbHex) {

        terapkanWarna(rgbHex, nomor);
    }
}


/* =========================================================
   UPDATE INFO WARNA
========================================================= */

function updateInfoWarna(nomor) {

    const rgb =
        nomor === 1 ? rgb1 : rgb2;

    const hex =
        rgbToHex(rgb[0], rgb[1], rgb[2]);

    const hasilNama =
        tentukanNamaWarna(
            rgb[0],
            rgb[1],
            rgb[2]
        );

    const infoDiv =
        document.getElementById(`info${nomor}`);

    infoDiv.innerHTML = `
        <span style="
            color:${hex};
            font-weight:bold;
        ">
            ${hasilNama.nama}
        </span>

        <span style="
            font-size:9px;
            color:#555;
        ">
            ${hex.toUpperCase()}
        </span>

        <span style="
            font-size:8px;
            color:#777;
        ">
            RGB(${rgb[0]}, ${rgb[1]}, ${rgb[2]})
        </span>
    `;
}


/* =========================================================
   CAMPUR WARNA
========================================================= */

function hitungCampuran() {

    /*
       Metode rata-rata RGB.
       Contoh:
       Merah + Biru
       = (255+0)/2 = 127
       = (0+0)/2 = 0
       = (0+255)/2 = 127

       Hasil ≈ #7F007F
    */

    const rMix =
        Math.round((rgb1[0] + rgb2[0]) / 2);

    const gMix =
        Math.round((rgb1[1] + rgb2[1]) / 2);

    const bMix =
        Math.round((rgb1[2] + rgb2[2]) / 2);

    const hasilHex =
        rgbToHex(rMix, gMix, bMix);

    const hasilNama =
        tentukanNamaWarna(
            rMix,
            gMix,
            bMix
        );

    const box =
        document.getElementById("resultBox");

    box.style.backgroundColor =
        hasilHex;

    document.getElementById(
        "namaHasil"
    ).innerText =
        hasilNama.nama;

    document.getElementById(
        "kodeHasil"
    ).innerText =
        `HEX: ${hasilHex.toUpperCase()} | RGB: (${rMix}, ${gMix}, ${bMix})`;
}


/* =========================================================
   RODA WARNA
========================================================= */

function drawColorWheel(canvasId) {

    const canvas =
        document.getElementById(canvasId);

    const ctx =
        canvas.getContext("2d");

    const r = 100;

    canvas.width = 200;
    canvas.height = 200;

    for (let x = -r; x <= r; x++) {

        for (let y = -r; y <= r; y++) {

            const distance =
                Math.sqrt(x * x + y * y);

            if (distance <= r) {

                let angle =
                    Math.atan2(y, x) *
                    (180 / Math.PI);

                if (angle < 0) {
                    angle += 360;
                }

                const saturation =
                    distance / r;

                const lightness = 0.5;

                const hex =
                    hslToHex(
                        angle,
                        saturation,
                        lightness
                    );

                ctx.fillStyle = hex;

                ctx.fillRect(
                    x + r,
                    y + r,
                    1,
                    1
                );
            }
        }
    }
}


/* =========================================================
   HSL → HEX
========================================================= */

function hslToHex(h, s, l) {

    let c =
        (1 - Math.abs(2 * l - 1)) * s;

    let x =
        c *
        (1 - Math.abs((h / 60) % 2 - 1));

    let m =
        l - c / 2;

    let r = 0,
        g = 0,
        b = 0;

    if (h < 60) {
        r = c;
        g = x;
    }
    else if (h < 120) {
        r = x;
        g = c;
    }
    else if (h < 180) {
        g = c;
        b = x;
    }
    else if (h < 240) {
        g = x;
        b = c;
    }
    else if (h < 300) {
        r = x;
        b = c;
    }
    else {
        r = c;
        b = x;
    }

    r = Math.round((r + m) * 255);
    g = Math.round((g + m) * 255);
    b = Math.round((b + m) * 255);

    return rgbToHex(r, g, b);
}


/* =========================================================
   UPLOAD FOTO
========================================================= */

function prosesUpload(event, nomor) {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    reader.onload = function(e) {

        const img = new Image();

        img.src = e.target.result;

        img.onload = function() {

            const canvas =
                document.createElement("canvas");

            const ctx =
                canvas.getContext("2d");

            canvas.width = 50;
            canvas.height = 50;

            ctx.drawImage(
                img,
                0,
                0,
                50,
                50
            );

            const p =
                ctx.getImageData(
                    25,
                    25,
                    1,
                    1
                ).data;

            terapkanWarna(
                [p[0], p[1], p[2]],
                nomor
            );
        };
    };

    reader.readAsDataURL(file);
}


/* =========================================================
   EVENT RODA WARNA
========================================================= */

["wheel1", "wheel2"].forEach(
    (id, idx) => {

        const canvas =
            document.getElementById(id);

        const nomor =
            idx + 1;


        function handleInteraction(e) {

            const rect =
                canvas.getBoundingClientRect();

            const clientX =
                e.touches
                    ? e.touches[0].clientX
                    : e.clientX;

            const clientY =
                e.touches
                    ? e.touches[0].clientY
                    : e.clientY;

            const x =
                clientX - rect.left;

            const y =
                clientY - rect.top;

            const ctx =
                canvas.getContext("2d");

            const scaleX =
                canvas.width / rect.width;

            const scaleY =
                canvas.height / rect.height;

            const px =
                Math.floor(x * scaleX);

            const py =
                Math.floor(y * scaleY);

            if (
                px < 0 ||
                py < 0 ||
                px >= canvas.width ||
                py >= canvas.height
            ) {
                return;
            }

            const pixel =
                ctx.getImageData(
                    px,
                    py,
                    1,
                    1
                ).data;

            if (pixel[3] > 0) {

                terapkanWarna(
                    [
                        pixel[0],
                        pixel[1],
                        pixel[2]
                    ],
                    nomor
                );
            }
        }


        canvas.addEventListener(
            "mousedown",
            e => {
                activeWheel = nomor;
                handleInteraction(e);
            }
        );

        window.addEventListener(
            "mousemove",
            e => {
                if (activeWheel === nomor) {
                    handleInteraction(e);
                }
            }
        );

        window.addEventListener(
            "mouseup",
            () => {
                activeWheel = null;
            }
        );


        canvas.addEventListener(
            "touchstart",
            e => {

                activeWheel = nomor;

                handleInteraction(e);

                e.preventDefault();

            },
            {
                passive: false
            }
        );


        canvas.addEventListener(
            "touchmove",
            e => {

                if (activeWheel === nomor) {

                    handleInteraction(e);

                }

                e.preventDefault();

            },
            {
                passive: false
            }
        );


        canvas.addEventListener(
            "touchend",
            () => {
                activeWheel = null;
            }
        );
    }
);


/* =========================================================
   JALANKAN RODA WARNA
========================================================= */

drawColorWheel("wheel1");
drawColorWheel("wheel2");

updateInfoWarna(1);
updateInfoWarna(2);
hitungCampuran();

</script>
