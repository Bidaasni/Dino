<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodja Streaming</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef2f3;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 380px;
            text-align: center;
            margin-bottom: 20px;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #219653;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .stream-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Bagian Live Streaming Radio -->
    <div class="card">
        <h2>Rodja Streaming</h2>
        <div class="stream-info">Putar Kajian Islam & Live Streaming Radio Rodja</div>
        <audio controls>
            <source src="https://live.radiorodja.com/stream" type="audio/mpeg">
            Browser Anda tidak mendukung pemutar audio.
        </audio>
    </div>

    <!-- Bagian Login / Register -->
    <div class="card">
        <h2>Akun Pengguna</h2>
        <form>
            <input type="text" placeholder="Username atau Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Masuk / Daftar</button>
        </form>
    </div>

</body>
</html>
