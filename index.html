    <!-- Tag Audio Baru (Pastikan file tus.mp3 ada di folder yang sama dengan index.html) -->
    <audio id="konsletSound" src="tus.mp3"></audio>

    <!-- Script Logika Saklar, Lampu, dan Suara -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const pullRing = document.getElementById('pullRing');
        const konsletSound = document.getElementById('konsletSound');
        const body = document.body;

        if (pullRing) {
          pullRing.addEventListener('click', function() {
            // Memunculkan elemen halaman dari mode gelap
            body.classList.add('revealed');
            
            // Mengganti status nyala/mati lampu
            body.classList.toggle('lit');

            // Memutar file tus.mp3 saat diketuk
            if (konsletSound) {
              konsletSound.currentTime = 0; 
              konsletSound.play().catch(function(error) {
                console.log("Pemutaran audio diblokir:", error);
              });
            }
          });
        }
      });
    </script>
  </body>
</html>
