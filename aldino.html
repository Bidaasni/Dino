<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aldino</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #0c0f16;
    --bg-glow: #0c0f16;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 34px;
    padding: 40px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse 900px 700px at 50% 38%, var(--bg-glow) 0%, var(--bg) 60%);
    background-color: var(--bg);
    transition: background-color 0.6s ease;
    overflow: hidden;
  }
  body.lit, body.surge  { --bg-glow: #4a3a14; background-color: #2a2210; }
  body.blown { --bg-glow: #0c0f16; background-color: #0c0f16; transition: background-color 0.12s ease; }

  .content-box {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 34px 30px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
  }
  body.revealed .content-box { opacity: 1; pointer-events: auto; }
  .kb-title {
    margin: 0 0 20px;
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 800;
    color: #d4af37;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }
  .btn-go {
    display: inline-block;
    background: linear-gradient(180deg, #d9b32a, #c5a017);
    color: #111;
    text-decoration: none;
    font-weight: bold;
    font-size: 18px;
    padding: 12px 45px;
    border-radius: 8px;
    box-shadow: 0 6px 0 #8c730b, 0 10px 15px rgba(0,0,0,0.4);
    transition: all 0.1s ease;
  }
  .btn-go:active {
    transform: translateY(6px);
    box-shadow: 0 0 0 #8c730b, 0 4px 6px rgba(0,0,0,0.4);
  }

  .bulb-wrap {
    position: relative;
    width: 200px;
    height: 340px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .bulb-svg { width: 100%; height: 100%; overflow: visible; }

  .glass {
    fill: rgba(255,255,255,0.05);
    stroke: rgba(255,255,255,0.35);
    stroke-width: 2;
    opacity: 0;
    transition: fill 0.5s ease, filter 0.4s ease, opacity 0.35s ease;
  }
  body.revealed .glass { opacity: 1; }
  body.lit .glass, body.surge .glass {
    fill: rgba(255, 225, 150, 0.30);
    filter: drop-shadow(0 0 30px rgba(255, 200, 90, 0.65)) drop-shadow(0 0 70px rgba(255, 180, 60, 0.4));
  }
  body.surge .glass { filter: drop-shadow(0 0 45px rgba(255,255,255,0.9)); }
  body.blown .glass { fill: rgba(120,110,90,0.10); transition: fill 0.12s ease, filter 0.12s ease; }

  .highlight { fill: rgba(255,255,255,0.5); opacity: 0; transition: opacity 0.35s ease; }
  body.revealed .highlight { opacity: 0.5; }

  .coil { fill: none; stroke: #55565c; stroke-width: 2.5; stroke-linecap: round; opacity: 0; transition: stroke 0.3s ease, opacity 0.35s ease; }
  body.revealed .coil.whole { opacity: 1; }
  body.lit .coil, body.surge .coil { stroke: #ffdf91; filter: drop-shadow(0 0 4px #ffb84d) drop-shadow(0 0 10px #ff9d2e); }
  body.surge .coil { stroke: #ffffff; }
  .coil.broken { opacity: 0; transition: none; }
  body.blown .coil.whole { opacity: 0; transition: none; }
  body.blown .coil.broken { opacity: 1; stroke: #2a2a2a; filter: none; transition: none; }

  .ember { fill: #ff9d2e; opacity: 0; }
  body.blown .ember { animation: emberFall 1.1s ease-out forwards; }
  .ember.e2 { animation-delay: 0.08s !important; }
  .ember.e3 { animation-delay: 0.16s !important; }
  @keyframes emberFall {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(22px) scale(0.3); }
  }

  .soot { fill: rgba(20,18,16,0); transition: fill 0.6s ease 0.2s; }
  body.blown .soot { fill: rgba(20,18,16,0.55); }

  .cap { fill: #cfd2d8; opacity: 0; transition: opacity 0.35s ease; }
  .cap-dark { fill: #babdc4; opacity: 0; transition: opacity 0.35s ease; }
  .cap-ring { stroke: #9a9da3; stroke-width: 1.5; opacity: 0; transition: opacity 0.35s ease; }
  body.revealed .cap, body.revealed .cap-dark, body.revealed .cap-ring { opacity: 1; }

  .cord { stroke: #6b6f78; stroke-width: 2.5; }
  .pull-ring {
    fill: #23262e;
    stroke: #6a6e78;
    stroke-width: 2;
    transition: transform 0.18s ease;
    transform-origin: 100px 300px;
    animation: ringGlint 2.6s ease-in-out infinite;
  }
  @keyframes ringGlint {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
    50% { filter: drop-shadow(0 0 4px rgba(200,210,225,0.55)); }
  }
  body.revealed .pull-ring { animation: none; filter: none; }
  body.tug .pull-ring { transform: translateY(16px); }

  .arc-flash {
    fill: none;
    stroke: #eaf6ff;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    filter: drop-shadow(0 0 4px #bfe9ff) drop-shadow(0 0 10px #6cc9ff);
  }
  body.sparking .arc-flash { animation: arcFlicker 0.55s steps(2, jump-none) infinite; }
  .arc-flash.a2 { animation-delay: 0.18s !important; }
  @keyframes arcFlicker {
    0%   { opacity: 0; }
    20%  { opacity: 1; }
    35%  { opacity: 0.1; }
    55%  { opacity: 1; }
    70%  { opacity: 0; }
    100% { opacity: 0; }
  }

  .flash-overlay {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    z-index: 5;
  }
  body.sparking .flash-overlay { animation: whiteFlash 1.8s steps(2, jump-none) infinite; }
  @keyframes whiteFlash {
    0%   { opacity: 0; }
    6%   { opacity: 0.5; }
    12%  { opacity: 0; }
    16%  { opacity: 0.3; }
    22%  { opacity: 0; }
    100% { opacity: 0; }
  }

  /* Kedap-kedip tidak stabil selama fase konslet (4 detik) */
  @keyframes surgeFlicker {
    0%, 100% { opacity: 1; }
    8%   { opacity: 0.35; }
    18%  { opacity: 1; }
    30%  { opacity: 0.55; }
    45%  { opacity: 1; }
    58%  { opacity: 0.25; }
    72%  { opacity: 1; }
    85%  { opacity: 0.5; }
  }
  body.surge .glass, body.surge .coil { animation: surgeFlicker 0.85s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
